json_feeds:
  - title: Galaxy News
    url: https://galaxyproject.org/news/feed.json
    list_key: "news"
    format: "{tease}\n{link}\n{images}"

    # Media channels get grouped based on whether their posts might need separate editing.
    # One output file with shared post body will be created for each group, but we'd often
    # want to edit bluesky posts separately because their different character limit.
    media:
      group1:
        linkedin-galaxyproject:
          - global
          - us
      group2:
        bluesky-galaxyproject:
          - global
          - us
      group3:
        mastodon-galaxyproject:
          - global
          - us
        mastodon-eu-freiburg:
          - all-eu
          - eu
          - freiburg
        matrix-eu-announce:
          - all-eu
          - eu

    # Media conflicts can be used to avoid unwanted double-posting. For every conflict,
    # the channel provided as the key, if selected, will prevent posting to all channels
    # listed below it.

    media_conflicts:
      mastodon-galaxyproject:
        - mastodon-eu-freiburg

    # If a post specifies a main_subsite, the channels selected through it
    # will not take part in the above conflict resolution, but can eliminate regular
    # channels according to their own rules below.
    # -> A channel selected through main_subsite will never be itself suppressed,
    # but can suppress channels selected through regular subsites.

    main_media_conflicts:
      mastodon-eu-freiburg:
        - mastodon-galaxyproject

    mentions:
      mastodon-galaxyproject:
        all-eu:
          - galaxyfreiburg@bawü.social
        eu:
          - galaxyfreiburg@bawü.social
        freiburg:
          - galaxyfreiburg@bawü.social
      mastodon-eu-freiburg:
        global:
          - galaxyproject@mstdn.science
        us:
          - galaxyproject@mstdn.science

    hashtags:
      mastodon-eu-freiburg:
        all:
          - UseGalaxy
          - GalaxyProject
        esg:
          - EuroScienceGateway
        freiburg:
          - UniFreiburg
      mastodon-galaxyproject:
        all:
          - UseGalaxy
          - GalaxyProject
        esg:
          - EuroScienceGateway
      bluesky-galaxyproject:
        all:
          - UseGalaxy
          - GalaxyProject
        esg:
          - EuroScienceGateway
      linkedin-galaxyproject:
        all:
          - UseGalaxy
          - GalaxyProject
        esg:
          - EuroScienceGateway

  - title: "Galaxy Events"
    url: https://galaxyproject.org/events/feed.json
    list_key: "events"
    format: "📣 {title}\n\n{tease}\n\n📍 {location}\n📅 {date}\n🔗 More info & registration: {link}\n\n{images}"

    media:
      group1:
        linkedin-galaxyproject:
          - global
          - us
      group2:
        bluesky-galaxyproject:
          - global
          - us
      group3:
        mastodon-galaxyproject:
          - global
          - us
        mastodon-eu-freiburg:
          - all-eu
          - eu
          - freiburg
        matrix-eu-announce:
          - all-eu
          - eu

    media_conflicts:
      mastodon-galaxyproject:
        - mastodon-eu-freiburg

    main_media_conflicts:
      mastodon-eu-freiburg:
        - mastodon-galaxyproject

    mentions:
      mastodon-galaxyproject:
        all-eu:
          - galaxyfreiburg@bawü.social
        eu:
          - galaxyfreiburg@bawü.social
        freiburg:
          - galaxyfreiburg@bawü.social
      mastodon-eu-freiburg:
        global:
          - galaxyproject@mstdn.science
        us:
          - galaxyproject@mstdn.science

    hashtags:
      mastodon-eu-freiburg:
        all:
          - UseGalaxy
          - GalaxyProject
        esg:
          - EuroScienceGateway
        freiburg:
          - UniFreiburg
      mastodon-galaxyproject:
        all:
          - UseGalaxy
          - GalaxyProject
        esg:
          - EuroScienceGateway
      bluesky-galaxyproject:
        all:
          - UseGalaxy
          - GalaxyProject
        esg:
          - EuroScienceGateway
      linkedin-galaxyproject:
        all:
          - UseGalaxy
          - GalaxyProject
        esg:
          - EuroScienceGateway


tag_feeds:
  # Tag feeds only ever take effect for items that are also present in the JSON
  # feeds above; their entries are matched by URL. Items found only in a tag
  # feed (e.g. events too far in the future to be included in a JSON event feed)
  # are skipped until they appear in a JSON feed as well.

  - title: "Tagged esg4stars"
  # Items on the Hub tagged "esg4stars" (https://galaxyproject.org/tags/esg4stars/)
  # are considered to be of high EU relevance by default and receive special treatment:
  # - they will always be routed to matrix-eu-announce unless restricted
  #   explicitly to just "freiburg" or the "us" and
  # - use mastodon-eu-freiburg instead of mastodon-galaxyproject unless restricted explicitly to "us",
  # - will always use the hashtag #ESG4Stars and
  # - mention @REA@ec.social-network.europa.eu on Mastodon and
  #   @scienceinnovation.ec.europa.eu on bluesky if the post is of "global" relevance

    url: https://galaxyproject.org/tags/esg4stars/feed.atom
    media:
      group1:
        linkedin-galaxyproject:
          - global
          - us
      group2:
        bluesky-galaxyproject:
          - global
          - us
      group3:
        mastodon-galaxyproject:
          - us
        mastodon-eu-freiburg:
          - global
          - all-eu
          - eu
          - freiburg
        matrix-eu-announce:
          - global
          - all-eu
          - eu

    media_conflicts:
      mastodon-eu-freiburg:
        - mastodon-galaxyproject

    hashtags:
      mastodon-eu-freiburg:
        all:
          - UseGalaxy
          - GalaxyProject
          - ESG4Stars
        freiburg:
          - UniFreiburg
      mastodon-galaxyproject:
        all:
          - UseGalaxy
          - GalaxyProject
          - ESG4Stars
      bluesky-galaxyproject:
        all:
          - UseGalaxy
          - GalaxyProject
          - ESG4Stars
      linkedin-galaxyproject:
        all:
          - UseGalaxy
          - GalaxyProject
          - ESG4Stars

    mentions:
      mastodon-galaxyproject:
        all:
          - galaxyfreiburg@bawü.social
      mastodon-eu-freiburg:
        global:
          - galaxyproject@mstdn.science
          - REA@ec.social-network.europa.eu
      bluesky-galaxyproject:
        global:
          - scienceinnovation.ec.europa.eu


